<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fast, private HAR file viewer. Inspect, filter, diff and analyze network captures entirely in your browser."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>HAR Viewer</title>
    <script>
      // Resolve the persisted theme before first paint to avoid a light/dark flash.
      ;(function () {
        try {
          var raw = localStorage.getItem('har-viewer:state')
          var pref = raw ? JSON.parse(raw).state.theme : 'system'
          var dark =
            pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
